services:
  - type: web
    name: preet-sports-seo-generator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_DIR
        value: /var/data
      - key: YOUTUBE_API_KEY
        sync: false
    disk:
      name: preet-sports-data
      mountPath: /var/data
      sizeGB: 1
